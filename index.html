<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>אנרגיה בקצב הכימיה</title>
<meta name="description" content="מערכת לימודית אינטראקטיבית: אנרגיה, אנתלפיה, קצב תגובה ואנטרופיה – כימיה 5 יח&quot;ל">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik+Burned&family=Secular+One&family=Rubik:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Concept: "מצלמה תרמית" — the unit is a journey along a reaction-coordinate curve. A sticky energy-profile bar is the navigation;
   heat is drawn with a thermal-imaging ramp (violet → magenta → orange → yellow). Light = lab graph paper, dark = infrared camera. */
:root{
  --paper:#f2f5fa; --surface:#ffffff; --sunk:#e8edf5; --ink:#11182c; --muted:#56617c; --line:#d3dbe8; --grid:rgba(43,89,195,.07);
  --cold:#2b59c3; --cold-soft:#e1e9fb; --heat:#d9480f; --heat-soft:#fde7dc;
  --t1:#4b23b0; --t2:#c0237a; --t3:#e2531b; --t4:#f0a500;
  --good:#1f8a4c; --good-soft:#dbf3e4; --bad:#c0352c; --bad-soft:#fbe2df; --focus:#2b59c3;
  --glow:rgba(226,83,27,.0); --hookbg:#141b33;
  --f-burn:"Rubik Burned","Secular One","Rubik",sans-serif;
  --f-display:"Secular One","Rubik",Arial,sans-serif;
  --f-body:"Rubik","Segoe UI",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
  --r:12px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#090b17; --surface:#121629; --sunk:#1a2038; --ink:#eef1fb; --muted:#9aa4c4; --line:#262e4d; --grid:rgba(120,140,255,.05);
  --cold:#7aa2ff; --cold-soft:#18234a; --heat:#ff7a3d; --heat-soft:#3a1c12;
  --t1:#6a3bff; --t2:#ff3d9a; --t3:#ff7a3d; --t4:#ffd23f;
  --good:#5ee09a; --good-soft:#12301f; --bad:#ff7b73; --bad-soft:#3c1a19; --focus:#7aa2ff; --glow:rgba(255,122,61,.35); --hookbg:#1c2342; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#090b17; --surface:#121629; --sunk:#1a2038; --ink:#eef1fb; --muted:#9aa4c4; --line:#262e4d; --grid:rgba(120,140,255,.05);
  --cold:#7aa2ff; --cold-soft:#18234a; --heat:#ff7a3d; --heat-soft:#3a1c12;
  --t1:#6a3bff; --t2:#ff3d9a; --t3:#ff7a3d; --t4:#ffd23f;
  --good:#5ee09a; --good-soft:#12301f; --bad:#ff7b73; --bad-soft:#3c1a19; --focus:#7aa2ff; --glow:rgba(255,122,61,.35); --hookbg:#1c2342; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.7;margin:0;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.thermal{background:linear-gradient(90deg,var(--t1),var(--t2),var(--t3),var(--t4))}

/* ---------- top bar: reaction coordinate ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topin{max-width:1120px;margin:0 auto;padding:10px 20px 0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font:inherit;font-family:var(--f-display);font-size:1.25rem;line-height:1.1;color:var(--ink);background:none;border:0;padding:0;cursor:pointer;display:flex;align-items:center;gap:10px}
.brand i{display:block;width:26px;height:26px;border-radius:50%;background:conic-gradient(from 200deg,var(--t1),var(--t2),var(--t3),var(--t4),var(--t1));box-shadow:0 0 18px var(--glow)}
.tools{margin-inline-start:auto;display:flex;gap:6px;flex-wrap:wrap}
.chipbtn,.navbtn.pill{font:inherit;font-size:.85rem;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.chipbtn:hover,.navbtn.pill:hover{border-color:var(--heat)}
.navbtn.pill[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.coord{max-width:1120px;margin:0 auto;padding:0 20px;overflow-x:auto;scrollbar-width:thin}
.track{position:relative;min-width:700px;height:86px}
.track svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.navbtn.st{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font:inherit;font-size:.74rem;font-weight:600;white-space:nowrap}
.navbtn.st .dotc{width:16px;height:16px;border-radius:50%;background:var(--surface);border:2.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:.55rem;color:var(--muted);transition:transform .2s}
.navbtn.st.done .dotc{background:var(--heat);border-color:var(--heat);color:var(--surface)}
.navbtn.st.ace .dotc{background:var(--t4);border-color:var(--t4)}
.navbtn.st:hover .dotc{transform:scale(1.25)}
.navbtn.st[aria-current="true"]{color:var(--ink)}
.navbtn.st[aria-current="true"] .dotc{width:22px;height:22px;border-color:var(--heat);box-shadow:0 0 0 5px var(--heat-soft),0 0 18px var(--glow)}
.navbtn.st .lbl{position:absolute;top:22px;left:50%;transform:translateX(-50%)}
.navbtn.st[aria-current="true"] .lbl{top:26px;font-weight:800}
.navbtn.st.up .lbl{top:auto;bottom:22px}
.navbtn.st.up[aria-current="true"] .lbl{bottom:26px}

.app{max-width:1120px;margin:0 auto;padding:28px 20px 70px}
html{scroll-padding-top:150px}
@media (max-width:700px){.app{padding:18px 16px 56px}.topin{padding:8px 16px 0}.coord{padding:0 8px}.top{position:static}html{scroll-padding-top:12px}.chipbtn,.navbtn.pill{font-size:.78rem;padding:3px 10px}.brand{font-size:1.1rem}}
/* ---------- main ---------- */
main{min-width:0}
.view{display:flex;flex-direction:column;gap:22px}
.eyebrow{font-size:.8rem;letter-spacing:.06em;font-weight:800;color:var(--heat);margin:0}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(1.9rem,4.4vw,2.7rem);line-height:1.15;margin:0;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:400;font-size:1.45rem;line-height:1.25;margin:0;text-wrap:balance}
h3{font-size:1.12rem;margin:0;font-weight:800}
p{margin:0;max-width:68ch}
.lead{font-size:1.12rem;color:var(--muted)}
section.blk{display:flex;flex-direction:column;gap:12px}
ul,ol{margin:0;padding-inline-start:1.3em;max-width:68ch}
li+li{margin-top:4px}
.hook{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.hook b{color:var(--heat)}
.key{border-inline-start:4px solid var(--cold);background:var(--cold-soft);padding:12px 16px;border-radius:0 var(--r) var(--r) 0;display:flex;flex-direction:column;gap:6px}
.warn{border-inline-start:4px solid var(--heat);background:var(--heat-soft);padding:12px 16px;border-radius:0 var(--r) var(--r) 0;display:flex;flex-direction:column;gap:6px}
.eq{direction:ltr;text-align:center;font-family:var(--f-mono);font-size:1.02rem;background:var(--sunk);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:nowrap}
.f{direction:ltr;unicode-bidi:isolate;font-family:var(--f-mono);font-size:.95em}
.neg{color:var(--heat);font-weight:700}.pos{color:var(--cold);font-weight:700}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;min-width:100%;font-size:.95rem}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right;vertical-align:top}
th{font-weight:800;background:var(--sunk)}
td.num{font-variant-numeric:tabular-nums;direction:ltr;text-align:right;font-family:var(--f-mono)}

/* ---------- widgets ---------- */
.widget{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.wtitle{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.wtag{font-size:.72rem;font-weight:800;letter-spacing:.05em;border-radius:999px;padding:2px 10px;background:var(--heat-soft);color:var(--heat)}
.wtag.sim{background:var(--cold-soft);color:var(--cold)}
canvas{display:block;width:100%;border-radius:10px;background:var(--sunk)}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.controls label{display:flex;align-items:center;gap:8px;font-size:.92rem;font-weight:600}
input[type=range]{accent-color:var(--cold);width:160px;max-width:100%}
.btn{font:inherit;font-weight:700;font-size:.95rem;border:1px solid var(--cold);background:var(--cold);color:var(--surface);border-radius:8px;padding:7px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--cold)}
.btn.heat{background:var(--heat);border-color:var(--heat)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.navbtn:focus-visible,.chipbtn:focus-visible,.opt:focus-visible,.mood:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.caption{min-height:3.4em;background:var(--sunk);border-radius:8px;padding:10px 14px;font-weight:600}
.readout{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:.92rem;font-variant-numeric:tabular-nums}
.readout b{font-family:var(--f-mono)}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.cardlet{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cardlet h4{margin:0;font-size:1rem}
.cardlet small{color:var(--muted)}
select,input[type=number],input[type=text],textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
input[type=number]{width:7.5em;direction:ltr}
textarea{width:100%;min-height:80px;resize:vertical}
.hessrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.hessrow .eq{flex:1 1 260px;text-align:left;padding:6px 10px}
.verdict{font-weight:800;border-radius:8px;padding:8px 12px}
.verdict.ok{background:var(--good-soft);color:var(--good)}
.verdict.no{background:var(--heat-soft);color:var(--heat)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{color:var(--cold);font-weight:700;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.9rem;background:var(--surface)}
.links a:hover{border-color:var(--cold)}

/* ---------- quiz & feelings ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.panel.quiz{border-top:5px solid var(--heat)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dot{width:22px;height:8px;border-radius:4px;background:var(--sunk);border:1px solid var(--line)}
.dot.ok{background:var(--good);border-color:var(--good)}.dot.no{background:var(--bad);border-color:var(--bad)}.dot.cur{border-color:var(--ink)}
.qtext{font-weight:700;font-size:1.08rem}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:right;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--cold)}
.opt .lt{font-family:var(--f-mono);color:var(--muted);flex:0 0 auto}
.opt.ok{background:var(--good-soft);border-color:var(--good)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.fb.ok{background:var(--good-soft)}.fb.no{background:var(--heat-soft)}
.fb strong{font-size:1rem}
.score{font-family:var(--f-display);font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.moods{display:flex;gap:8px;flex-wrap:wrap}
.mood{font:inherit;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:72px}
.mood span{font-size:1.6rem;line-height:1}
.mood small{font-size:.78rem;color:var(--muted)}
.mood[aria-pressed="true"]{border-color:var(--cold);background:var(--cold-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--cold);color:var(--surface);border-color:var(--cold)}
.teacher{display:flex;gap:12px;align-items:flex-start;background:var(--cold-soft);border-radius:12px;padding:12px 14px}
.teacher .av{flex:0 0 auto;width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--cold),var(--heat));color:var(--surface);display:grid;place-items:center;font-family:var(--f-display);font-size:1rem}
.teacher p{max-width:none}
.navfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.report{white-space:pre-wrap;font-family:var(--f-body);background:var(--sunk);border-radius:10px;padding:14px;max-height:420px;overflow:auto}
.homegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.homecard{font:inherit;text-align:right;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.homecard:hover{border-color:var(--cold)}
.homecard .n{font-family:var(--f-mono);font-size:.8rem;color:var(--heat)}
.homecard small{color:var(--muted)}
.thermobar{height:10px;border-radius:6px;background:linear-gradient(90deg,var(--heat),var(--cold))}

.mediabox video{display:block;width:100%;max-width:360px;max-height:70vh;margin:0 auto;border-radius:12px;background:#000;aspect-ratio:9/16;object-fit:contain}
.mediabox audio{width:100%}
/* ---------- mind map ---------- */
.mmwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.mm,.mm ul{list-style:none;margin:0;padding:0}
.mm ul{padding-inline-start:26px;position:relative}
.mm li{position:relative;margin:0;padding-block:5px}
.mm ul>li::before{content:"";position:absolute;inset-inline-start:-16px;top:0;bottom:0;border-inline-start:2px solid var(--line)}
.mm ul>li:last-child::before{bottom:auto;height:22px}
.mm ul>li::after{content:"";position:absolute;inset-inline-start:-16px;top:22px;width:12px;border-top:2px solid var(--line)}
.mnode{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.mnode span,.mtog{font:inherit;border-radius:10px;padding:5px 12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);text-align:right}
.mtog{cursor:pointer;font-weight:700}
.mtog::before{content:"+";display:inline-block;width:1.1em;color:var(--cold);font-family:var(--f-mono)}
.mtog[aria-expanded="true"]::before{content:"−"}
.d0>.mnode .mtog{font-family:var(--f-display);font-weight:400;font-size:1.25rem;background:linear-gradient(90deg,var(--heat-soft),var(--cold-soft));border-color:transparent}
.d1>.mnode .mtog{background:var(--cold-soft);border-color:transparent}
.d2>.mnode span,.d3>.mnode span{font-size:.95rem}
.mgo{font:inherit;font-size:.8rem;font-weight:700;color:var(--heat);background:none;border:1px solid var(--line);border-radius:999px;padding:2px 10px;cursor:pointer}
/* ---------- flashcards ---------- */
.cardlink{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);border:1px dashed var(--cold);border-radius:12px;padding:12px 16px}
.cardlink span{color:var(--muted);font-size:.92rem}
.fprog{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.fbar{height:6px;border-radius:4px;background:var(--sunk);overflow:hidden}.fbar i{display:block;height:100%;background:var(--good);transition:width .4s}
.fcard{display:block;width:100%;max-width:640px;margin:6px auto 0;min-height:240px;border:0;padding:0;background:none;cursor:pointer;perspective:1200px;font:inherit;color:var(--ink)}
.fin{position:relative;display:grid;min-height:240px;transition:transform .5s;transform-style:preserve-3d}
.fcard.flip .fin{transform:rotateY(180deg)}
.fface{grid-area:1/1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;padding:24px 22px;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center}
.ffront{background:var(--surface);border:1px solid var(--line);box-shadow:0 6px 18px -10px rgba(0,0,0,.35)}
.fback{background:var(--cold-soft);border:1px solid var(--cold);transform:rotateY(180deg)}
.fface small{font-size:.78rem;font-weight:800;letter-spacing:.04em;color:var(--heat)}
.fface em{font-style:normal;font-size:.82rem;color:var(--muted)}
.ftxt{font-size:1.18rem;font-weight:700;line-height:1.5;max-width:40ch}
.fback .ftxt{font-weight:600}
.fnav,.fknow{justify-content:center}
@media (prefers-reduced-motion:reduce){.fin{transition:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===================== v3 layer ===================== */
.alt-note{display:flex;flex-direction:column;gap:2px;border:2px dashed var(--t2);border-radius:14px;padding:10px 16px;background:var(--surface)}
.alt-note b{color:var(--t2);font-size:.95rem}
.tagp.alt{color:var(--surface);background:var(--t2);border-color:var(--t2);font-weight:700}
.navbtn.st.alt .dotc{border-style:dashed;border-color:var(--t2)}
.navbtn.st.alt.done .dotc{border-style:solid}

.exam-note{background:var(--hookbg);color:#eef1fb;border-radius:12px;padding:10px 16px;font-weight:600;border-inline-start:6px solid var(--t4)}
.exam-note b{color:#ffd23f}
main{min-width:0;max-width:820px;margin:0 auto}
h1{font-family:var(--f-display);font-weight:400;letter-spacing:-.01em}
h2{font-family:var(--f-display);font-weight:400;font-size:1.5rem}
.eyebrow{font-size:.85rem;letter-spacing:0;color:var(--heat);font-weight:800}
.hook{position:relative;border:0;background:var(--hookbg);color:#eef1fb;border-radius:16px;padding:20px 22px;overflow:hidden}
.hook::before{content:"";position:absolute;inset:0 0 auto 0;height:4px}
.hook::before{background:linear-gradient(90deg,var(--t1),var(--t2),var(--t3),var(--t4))}
.hook b{color:#ffd23f;font-size:.85rem;font-weight:800}
.hook p{font-size:1.12rem;font-weight:500}
.key{border-inline-start:0;border-radius:14px;background:var(--cold-soft);position:relative;padding:14px 18px 14px 18px;padding-inline-start:52px}
.key::before{content:"✦";position:absolute;inset-inline-start:16px;top:12px;font-size:1.2rem;color:var(--cold)}
.warn{border-inline-start:0;border-radius:14px;background:var(--heat-soft);position:relative;padding:14px 18px;padding-inline-start:52px}
.warn::before{content:"!";position:absolute;inset-inline-start:16px;top:12px;width:24px;height:24px;border-radius:50%;background:var(--heat);color:var(--surface);display:grid;place-items:center;font-weight:800;font-size:.9rem}
.eq{background:var(--surface);border:1px dashed var(--line);border-radius:10px}
.widget{border-radius:18px;box-shadow:0 12px 30px -24px rgba(17,24,44,.45);position:relative}
.widget::after{content:"";position:absolute;inset-inline:18px;top:-1px;height:3px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,var(--t1),var(--t2),var(--t3),var(--t4));opacity:.9}
.wtag{letter-spacing:0;background:var(--ink);color:var(--paper)}
.wtag.sim{background:var(--cold);color:var(--surface)}
canvas{border-radius:12px}
.btn{border-radius:999px;padding:8px 18px;transition:transform .15s,box-shadow .15s}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 16px -8px var(--cold)}
.btn.heat{background:linear-gradient(90deg,var(--t2),var(--t3));border-color:transparent;color:#fff}
.btn.heat:hover:not(:disabled){box-shadow:0 8px 20px -8px var(--t3)}
.caption{border-radius:12px;border-inline-start:3px solid var(--heat)}
.panel{border-radius:18px}
.panel.quiz{border-top:0;position:relative;overflow:hidden}
.panel.quiz::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:linear-gradient(90deg,var(--t1),var(--t2),var(--t3),var(--t4))}
.dots{gap:4px;flex-wrap:nowrap;background:var(--sunk);border-radius:999px;padding:4px}
.dot{flex:1;height:10px;border:0;border-radius:999px;background:transparent}

html:`
<div class="hook"><b>שאלת פתיחה</b><p>כוס תה רותח ואמבטיה מלאה מים חמימים. באיזו מהן הטמפרטורה גבוהה יותר? ובאיזו יש יותר אנרגיה? רשמו לעצמכם תשובה לפני שממשיכים. נחזור אליה בסוף הפרק.</p></div>
<section class="blk"><h2>האנרגיה של החלקיקים</h2>
<p>כל חומר בנוי מחלקיקים (אטומים, מולקולות או יונים) שנמצאים בתנועה מתמדת. לחלקיקים יש שני סוגים של אנרגיה:</p>
<ul>
<li><b>אנרגיה קינטית</b>: אנרגיית התנועה של החלקיקים. ככל שחלקיק נע מהר יותר, האנרגיה הקינטית שלו גדולה יותר. <b>האנרגיה הקינטית הכוללת</b> היא סכום האנרגיות הקינטיות של כל החלקיקים בדגימה.</li>
<li><b>אנרגיה פוטנציאלית</b>: אנרגיה "אגורה" שנובעת מכוחות המשיכה והדחייה בין החלקיקים, גם בתוך הקשרים הכימיים וגם בין המולקולות. כשמרחיקים זה מזה חלקיקים שנמשכים זה לזה, האנרגיה הפוטנציאלית עולה.</li>
</ul>
<div class="key"><h3>אנרגיה פנימית</h3><p>האנרגיה הפנימית של חומר היא סכום האנרגיה הקינטית והאנרגיה הפוטנציאלית של כל החלקיקים שבו. האנרגיה הפוטנציאלית היא מרכיב של האנרגיה הפנימית.</p>
<div class="eq">אנרגיה פנימית = אנרגיה קינטית כוללת + אנרגיה פוטנציאלית</div></div>
</section>
<section class="blk"><h2>טמפרטורה היא ממוצע</h2>
<p>בדגימה אחת החלקיקים נעים במהירויות שונות: יש איטיים ויש מהירים. <b>הטמפרטורה היא מדד לאנרגיה הקינטית הממוצעת של החלקיקים.</b> לכן הטמפרטורה לא תלויה בכמות החומר, אבל האנרגיה הפנימית כן תלויה בה.</p>
<p>האנרגיה הקינטית הממוצעת עומדת ביחס ישר לטמפרטורה בסולם קלווין: אם הטמפרטורה בקלווין מוכפלת, גם האנרגיה הקינטית הממוצעת מוכפלת.</p>
</section>
<div class="widget" data-w="particles"></div>
<div class="warn"><h3>תפיסה שגויה נפוצה</h3><p>"לגוף חם יותר יש תמיד יותר אנרגיה." לא בהכרח. בכוס התה הטמפרטורה גבוהה יותר (אנרגיה קינטית ממוצעת גבוהה), אבל באמבטיה יש הרבה יותר חלקיקים, ולכן האנרגיה הפנימית הכוללת שלה גדולה יותר.</p></div>

{q:'דגימת הליום ודגימת ארגון באותה טמפרטורה. מה נכון?',o:['האנרגיה הקינטית הממוצעת של שתיהן שווה','לארגון אנרגיה קינטית ממוצעת גבוהה יותר כי הוא כבד','להליום אנרגיה קינטית ממוצעת גבוהה יותר','אי אפשר לדעת'],a:0,e:'באותה טמפרטורה האנרגיה הקינטית הממוצעת זהה. אטומי ההליום הקלים פשוט נעים מהר יותר כדי להגיע לאותה אנרגיה.'},

<div class="hook"><b>שאלת פתיחה</b><p>שקית קירור של עזרה ראשונה מתקררת כשלוחצים עליה. מאיפה "נלקחת" האנרגיה? ולאן היא הולכת?</p></div>
<section class="blk"><h2>מי במרכז הסיפור?</h2>
<p>כדי לדבר על מעברי אנרגיה צריך להחליט על מה אנחנו מסתכלים.</p>

<section class="blk"><h2>לאן זורמת האנרגיה?</h2>
<ul><li>בתגובה <b class="neg">אקסותרמית</b> אנרגיה עוברת <b>מהמערכת אל הסביבה</b>. הסביבה מתחממת. מדחום בתמיסה מראה עלייה.</li>
<li>בתגובה <b class="pos">אנדותרמית</b> אנרגיה עוברת <b>מהסביבה אל המערכת</b>. הסביבה מתקררת. המבחנה מרגישה קרה ביד.</li></ul>
<div class="key"><p><b>חממית</b> (כרית גרגרי פשתן שמחממים במיקרוגל): במיקרוגל אנרגיה עוברת מהמיקרוגל אל הכרית. כשמניחים אותה על שריר כואב, אנרגיה עוברת מהכרית (המערכת) אל הגוף (הסביבה).</p></div>
<div class="key"><p>בשקית הקירור מומס מלח (למשל אמוניום חנקתי) במים. התהליך אנדותרמי: האנרגיה נלקחת מהסביבה, כולל מהעור שלכם, ולכן מרגישים קור.</p></div>
</section>

{
id:'enthalpy', title:'אנתלפיה: תגובות אקסותרמיות ואנדותרמיות', short:'ΔH, גרף, יחידות ו-Q',
html:`
<div class="hook"><b>שאלת פתיחה</b><p>בשריפת גז בישול משתחררת הרבה אנרגיה. בבישול ביצה משקיעים אנרגיה. איך אפשר לתאר את שתי התופעות בשפה אחת, כמותית?</p></div>
<section class="blk"><h2>אנתלפיה ושינוי באנתלפיה</h2>
<p><b>אנתלפיה (H)</b> מתארת את "תכולת האנרגיה" של חומרים בלחץ קבוע. אי אפשר למדוד אנתלפיה של חומר באופן מוחלט, אבל אפשר למדוד את <b>השינוי</b> בה במהלך תגובה:</p>
<div class="eq">ΔH = H(products) − H(reactants)</div>
<div class="split">
<div class="cardlet"><h4 class="neg">תגובה אקסותרמית</h4><p>אנרגיה משתחררת לסביבה. האנתלפיה של התוצרים נמוכה מזו של המגיבים.</p><p><b class="f">ΔH &lt; 0</b></p></div>
<div class="cardlet"><h4 class="pos">תגובה אנדותרמית</h4><p>אנרגיה נקלטת מהסביבה. האנתלפיה של התוצרים גבוהה מזו של המגיבים.</p><p><b class="f">ΔH &gt; 0</b></p></div>
</div>
</section>
<div class="widget" data-w="diagram" data-mode="enthalpy"></div>
<section class="blk"><h2>שתי דרכים לייצג ΔH</h2>
<ol><li><b>בגרף</b> (דיאגרמת אנתלפיה): רמת המגיבים, רמת התוצרים, וחץ ΔH ביניהן.</li>
<li><b>ליד ניסוח התגובה</b>:</li></ol>
<div class="eq">2H<sub>2</sub>(g) + O<sub>2</sub>(g) → 2H<sub>2</sub>O(l) &nbsp;&nbsp; ΔH° = −572 kJ</div>
<p>יחידות: <b>קילוג'אול (kJ)</b> או ג'אול (J). הסימן ° מציין תנאים סטנדרטיים.</p>
</section>
<section class="blk"><h2>ΔH מתייחס לניסוח</h2>
<p>ערך ΔH מתאר את התגובה <b>בדיוק כפי שהיא מנוסחת</b>: מספרי המולים הם המקדמים. בדוגמה למעלה, כשמגיבים 2 מול H<sub>2</sub> עם 1 מול O<sub>2</sub> משתחררים 572 kJ.</p>
<ul><li>אם הופכים את כיוון התגובה, הסימן של ΔH מתהפך: <span class="f">2H₂O(l) → 2H₂(g) + O₂(g)   ΔH° = +572 kJ</span></li>
<li>אם מכפילים את המקדמים, מכפילים גם את ΔH.</li></ul>
<div class="key"><h3>ΔH לעומת Q</h3><p><b>ΔH</b> הוא ערך קבוע לתגובה כפי שנוסחה. <b>Q</b> היא כמות האנרגיה שעברה בפועל, ותלויה בכמות החומר שהגיבה.</p>
<p>לדוגמה: בשריפת 1 מול H<sub>2</sub> משתחררים 572 ÷ 2 = <b>286 kJ</b>. בשריפת 3 מול H<sub>2</sub> משתחררים 3 × 286 = <b>858 kJ</b>.</p></div>
</section>
<div class="widget" data-w="qcalc"></div>
<section class="blk"><h3>סרטונים להעמקה</h3>${vid([['תגובות אקסותרמיות ואנדותרמיות','תגובה אקסותרמית ואנדותרמית כימיה'],['Enthalpy change explained','enthalpy change exothermic endothermic energy diagram']])}</section>
`,

{q:'איזו טענה על ΔH ו-Q נכונה?',o:['ΔH ו-Q זהים תמיד','ΔH מתייחס לכמויות שבניסוח; Q תלוי בכמות שהגיבה בפועל','Q קבוע לכל תגובה','ΔH תלוי בגודל הכלי'],a:1,e:'ΔH הוא "תעודת הזהות" של התגובה כפי שנוסחה. Q מחושב לפי כמות החומר בניסוי.'}
]},

{
id:'phases', title:'אנתלפיה בשינויי מצב צבירה', short:'התכה, אידוי, המראה',
html:`
<div class="hook"><b>שאלת פתיחה</b><p>למה יוצאים מהבריכה ומרגישים קור, גם ביום חם? ומה קשור לזה הקטע השטוח בגרף החימום של מים?</p></div>
<section class="blk"><h2>שינוי מצב צבירה הוא תהליך עם ΔH</h2>
<p>במעבר ממוצק לנוזל ומנוזל לגז מתגברים על כוחות המשיכה בין החלקיקים. זה דורש אנרגיה, ולכן התהליכים האלה <b class="pos">אנדותרמיים</b>. התהליכים ההפוכים <b class="neg">אקסותרמיים</b>, עם אותו ערך ובסימן הפוך.</p>
<div class="tblwrap"><table><thead><tr><th>תהליך</th><th>שם האנתלפיה</th><th>דוגמה: מים</th><th>תהליך הפוך</th></tr></thead><tbody>
<tr><td>מוצק → נוזל</td><td>אנתלפיית התכה</td><td class="num">H₂O(s) → H₂O(l)  ΔH = +6.0 kJ</td><td>קפיאה: −6.0 kJ</td></tr>
<tr><td>נוזל → גז</td><td>אנתלפיית אידוי</td><td class="num">H₂O(l) → H₂O(g)  ΔH = +40.7 kJ</td><td>עיבוי: −40.7 kJ</td></tr>
<tr><td>מוצק → גז</td><td>אנתלפיית המראה</td><td class="num">H₂O(s) → H₂O(g)  ΔH ≈ +46.7 kJ</td><td>ריבוץ (גז → מוצק)</td></tr>
</tbody></table></div>
<p style="color:var(--muted);font-size:.92rem">הערכים למים: התכה ב-0°C, אידוי ב-100°C, לכל מול.</p>
</section>
<div class="widget" data-w="heating"></div>
<section class="blk"><h2>למה אנתלפיית האידוי גדולה בהרבה?</h2>
<p>בהתכה החלקיקים עדיין קרובים זה לזה, רק הסדר הקבוע של המוצק נשבר. באידוי החלקיקים מתרחקים מאוד וכמעט כל כוחות המשיכה ביניהם מתבטלים. לכן נדרשת הרבה יותר אנרגיה.</p>
<div class="key"><h3>חשוב לזכור</h3><p>בשינוי מצב צבירה <b>לא נשברים קשרים קוולנטיים בתוך המולקולות</b>. מתגברים על כוחות בין המולקולות. המולקולה H<sub>2</sub>O נשארת H<sub>2</sub>O גם באדים.</p></div>
<p>אנתלפיית ההמראה שווה לסכום אנתלפיית ההתכה ואנתלפיית האידוי. זו דוגמה ראשונה לחוק הס, שנלמד בפרק הבא.</p>
</section>
<section class="blk"><h3>סרטונים להעמקה</h3>${vid([['עקומת חימום של מים','עקומת חימום מים מצבי צבירה'],['Heating curve of water','heating curve of water enthalpy of fusion vaporization']])}</section>
`,

{
id:'hess', title:'חוק הס', short:'חישוב ΔH ממסלול עקיף',
html:`
<div class="hook"><b>שאלת פתיחה</b><p>מטפסים לפסגת הר: פעם בשביל הקצר והתלול ופעם בשביל ארוך ומתפתל. האם הפרש הגובה בין המכונית לפסגה תלוי בשביל?</p></div>
<section class="blk"><h2>הרעיון</h2>
<div class="key"><h3>חוק הס</h3><p>השינוי באנתלפיה בתגובה תלוי רק במצב ההתחלתי (המגיבים) ובמצב הסופי (התוצרים), ולא במסלול. אם אפשר להגיע מהמגיבים לתוצרים בכמה שלבים, ΔH של התגובה הכוללת שווה לסכום ΔH של השלבים.</p></div>
<p>למה זה שימושי? יש תגובות שקשה או בלתי אפשרי למדוד ישירות, למשל יצירת CO מפחמן בלי שייווצר גם CO<sub>2</sub>. בעזרת חוק הס מחשבים את ΔH שלהן מתגובות שכן אפשר למדוד.</p>
</section>
<section class="blk"><h2>שני כללי עבודה</h2>
<ol><li><b>היפוך ניסוח</b>: הופכים את הסימן של ΔH.</li>
<li><b>הכפלת ניסוח במספר</b>: מכפילים את ΔH באותו מספר.</li></ol>
</section>
<section class="blk"><h2>דוגמה פתורה</h2>
<p>מטרה: <span class="f">C(s) + ½O₂(g) → CO(g)   ΔH = ?</span></p>
<div class="eq">(1)  C(s) + O<sub>2</sub>(g) → CO<sub>2</sub>(g) &nbsp; ΔH = −393.5 kJ</div>
<div class="eq">(2)  CO(g) + ½O<sub>2</sub>(g) → CO<sub>2</sub>(g) &nbsp; ΔH = −283.0 kJ</div>
<ol><li>C צריך להיות בצד המגיבים, כמו ב-(1). משאירים את (1) כפי שהיא.</li>
<li>CO צריך להיות בצד התוצרים, ולכן הופכים את (2): <span class="f">CO₂(g) → CO(g) + ½O₂(g)   ΔH = +283.0 kJ</span></li>
<li>מחברים: CO<sub>2</sub> מבטל את עצמו, ומ-O<sub>2</sub> נשאר ½ בצד המגיבים.</li>
<li>ΔH = −393.5 + 283.0 = <b class="neg">−110.5 kJ</b></li></ol>
</section>
<div class="widget" data-w="hess"></div>
<section class="blk"><h3>סרטונים להעמקה</h3>${vid([['חוק הס – הסבר ותרגול','חוק הס כימיה תרגול'],['Hess\'s law explained','Hess\'s law enthalpy explained']])}</section>
`,

{q:'H₂(g) + ½O₂(g) → H₂O(l)  ΔH = −286 kJ;  H₂O(l) → H₂O(g)  ΔH = +44 kJ. מהו ΔH של H₂(g) + ½O₂(g) → H₂O(g)?',o:['−330 kJ','−242 kJ','+242 kJ','−286 kJ'],a:1,e:'מחברים: −286 + 44 = −242 kJ. יצירת אדים משחררת פחות אנרגיה, כי חלק ממנה "מושקע" באידוי.'}
]},

{
id:'bonds', title:'אנתלפיות קשר', short:'שבירה ויצירה של קשרים',
html:`
<div class="hook"><b>שאלת פתיחה</b><p>אם בכל תגובה כימית שוברים קשרים ויוצרים קשרים חדשים, מה קובע אם בסוף התגובה אנרגיה תשתחרר או תיקלט?</p></div>
<section class="blk"><h2>שבירה דורשת, יצירה משחררת</h2>
<div class="split">
<div class="cardlet"><h4 class="pos">שבירת קשר</h4><p>תמיד <b>אנדותרמית</b>. צריך להשקיע אנרגיה כדי להרחיק אטומים שנמשכים זה לזה.</p></div>
<div class="cardlet"><h4 class="neg">יצירת קשר</h4><p>תמיד <b>אקסותרמית</b>. כשאטומים נקשרים משתחררת אנרגיה.</p></div>
</div>
<div class="key"><h3>אנתלפיית קשר</h3><p>האנרגיה שיש להשקיע בפירוק מול קשרים קוולנטיים במולקולות של חומר במצב גז, לקבלת אטומים בודדים. היחידות: kJ/mol.</p><div class="eq" style="background:transparent">H<sub>2</sub>(g) → 2H(g) &nbsp; ΔH° = +436 kJ &nbsp;⇒&nbsp; ΔH<sub>B</sub>(H–H) = 436 kJ/mol</div><p>ככל שהקשר חזק יותר, אנתלפיית הקשר גדולה יותר. היא עולה עם סדר הקשר (C–C 348, C=C 612 kJ/mol) ויורדת כשרדיוס האטומים גדל.</p></div>
</section>
<div class="widget" data-w="bondsAnim"></div>
<section class="blk"><h2>חישוב ΔH מאנתלפיות קשר</h2>
<div class="exam-note" role="note"><b>שימו לב:</b> חישוב ΔH מאנתלפיות קשר ירד מבגרות תשפ"ז. החומר נשאר כאן להעשרה ולהבנה של שבירה ויצירה של קשרים.</div>
<div class="eq">ΔH = Σ(bonds broken) − Σ(bonds formed)</div>
<p>אפשר לדמיין את התגובה בשני שלבים תיאורטיים: (1) פירוק כל הקשרים במגיבים לאטומים בודדים, שלב אנדותרמי; (2) חיבור האטומים לקשרים של התוצרים, שלב אקסותרמי.</p>
<p>במילים: <b>סכום אנתלפיות הקשרים שנשברים במגיבים</b> פחות <b>סכום אנתלפיות הקשרים שנוצרים בתוצרים</b>. אם יצירת הקשרים משחררת יותר ממה ששבירתם דרשה, התגובה אקסותרמית.</p>
<div class="warn"><h3>מגבלה בתוכנית הלימודים</h3><p>החישוב מוגבל לתגובות שבהן <b>כל המגיבים והתוצרים במצב גז</b>. אנתלפיות הקשר מוגדרות לגז, ובמצבים אחרים יש גם כוחות בין־מולקולריים שלא נכללים בחישוב.</p></div>
<div class="tblwrap"><table><thead><tr><th>קשר</th><th>אנתלפיית קשר (kJ/mol)</th><th>קשר</th><th>אנתלפיית קשר (kJ/mol)</th></tr></thead><tbody>
<tr><td class="num">H–H</td><td class="num">436</td><td class="num">O=O</td><td class="num">498</td></tr>
<tr><td class="num">Cl–Cl</td><td class="num">243</td><td class="num">O–H</td><td class="num">463</td></tr>
<tr><td class="num">H–Cl</td><td class="num">432</td><td class="num">N≡N</td><td class="num">945</td></tr>
<tr><td class="num">Br–Br</td><td class="num">193</td><td class="num">N–H</td><td class="num">391</td></tr>
<tr><td class="num">H–Br</td><td class="num">366</td><td class="num">C–H</td><td class="num">413</td></tr>
</tbody></table></div>
<p style="color:var(--muted);font-size:.92rem">ערכים ממוצעים מקובלים. בבחינה השתמשו תמיד בערכים שניתנים בשאלה.</p>
</section>

/* ================= 7 ================= */
{
id:'rate', title:'קצב תגובה', short:'התנגשויות, אנרגיית שפעול, זרז',
html:`
<div class="hook"><b>שאלת פתיחה</b><p>שריפת נייר באוויר היא תגובה אקסותרמית מאוד. אז למה הספר שלכם לא בוער מעצמו על המדף?</p></div>
${VIDEO()}
<section class="blk"><h2>מהו קצב תגובה?</h2>
<p>קצב התגובה מתאר באיזו מהירות נצרכים המגיבים ונוצרים התוצרים: שינוי בכמות (או בריכוז) של חומר ביחידת זמן.</p>
</section>
<section class="blk"><h2>מודל ההתנגשויות</h2>
<p>כדי שתתרחש תגובה, חלקיקי המגיבים צריכים <b>להתנגש</b>. אבל לא כל התנגשות מובילה לתגובה. התנגשות <b>פורייה</b> (אפקטיבית) היא התנגשות שבה:</p>
<ul><li>האנרגיה של החלקיקים המתנגשים <b>גדולה או שווה לאנרגיית השפעול (E<sub>a</sub>)</b>;</li>
<li>החלקיקים מתנגשים <b>בכיוון מתאים</b>.</li></ul>
<div class="key"><h3>אנרגיית שפעול ותצמיד משופעל</h3><p><b>אנרגיית שפעול</b>: האנרגיה המינימלית שנדרשת כדי שהתנגשות תוביל לתגובה. בגרף זה ההפרש בין רמת המגיבים לפסגה.</p><p><b>תצמיד משופעל</b>: מצב המעבר בפסגת הגרף. קשרים ישנים נחלשים וקשרים חדשים מתחילים להיווצר. זה המצב בעל האנרגיה הגבוהה ביותר במהלך התגובה.</p></div>

<div class="hook"><b>שאלת פתיחה</b><p>טיפת דיו בכוס מים מתפזרת מעצמה. האם ראיתם פעם דיו שמתאסף בחזרה לטיפה אחת? מה "מכוון" את התהליכים בטבע?</p></div>
<section class="blk"><h2>מהי אנטרופיה?</h2>
<p><b>אנטרופיה (S)</b> היא מדד לפיזור האנרגיה ולפיזור החלקיקים בחומר. אפשר לחשוב עליה כמספר הדרכים (המצבים המיקרוסקופיים) שבהם אפשר לסדר את החלקיקים ואת האנרגיה שלהם. יותר אפשרויות = אנטרופיה גבוהה יותר.</p>
<div class="eq">S(solid) &lt; S(liquid) &lt; S(gas)</div>
<p>לאותו חומר: במוצק החלקיקים מסודרים וקבועים במקומם, בנוזל הם נעים זה ליד זה, ובגז הם מפוזרים בכל הכלי. לכן לגז האנטרופיה הגבוהה ביותר.</p>
</section>
<div class="widget" data-w="spread"></div>
<section class="blk"><h2>הערכת הסימן של ΔS המערכת</h2>
<ol><li><b>שינוי במצב צבירה</b>: מעבר לכיוון גז (התכה, אידוי, המראה) → ΔS > 0.</li>
<li><b>שינוי במספר מולי הגז</b>: אם בתוצרים יש יותר מולי גז מאשר במגיבים → ΔS > 0.</li></ol>
<div class="eq">N<sub>2</sub>(g) + 3H<sub>2</sub>(g) → 2NH<sub>3</sub>(g) &nbsp;&nbsp; 4 mol gas → 2 mol gas &nbsp; ⇒ ΔS<sub>sys</sub> &lt; 0</div>
<p>חישוב כמותי, לפי ערכי S° מטבלה (בהתחשב במקדמים):</p>
<div class="eq">ΔS°<sub>sys</sub> = ΣS°(products) − ΣS°(reactants)</div>
</section>
<section class="blk"><h2>הסביבה והיקום</h2>
<p>תגובה אקסותרמית משחררת אנרגיה לסביבה ומגדילה את פיזור האנרגיה בה, כלומר את האנטרופיה של הסביבה:</p>
<div class="eq">ΔS°<sub>surr</sub> = −ΔH° / T</div>
<div class="warn"><h3>מלכודת יחידות</h3><p>ΔH נתון בדרך כלל ב-<b>kJ</b> ו-ΔS ב-<b>J/K</b>. כפלו את ΔH ב-1000 לפני החילוק! T בקלווין.</p></div>
<div class="key"><h3>החוק השני של התרמודינמיקה</h3><div class="eq" style="background:transparent">ΔS°<sub>univ</sub> = ΔS°<sub>sys</sub> + ΔS°<sub>surr</sub></div><p>תהליך <b>ספונטני</b> (מתרחש מעצמו) הוא תהליך שבו האנטרופיה של היקום גדלה: <b>ΔS<sub>univ</sub> &gt; 0</b>. אם ΔS<sub>univ</sub> &lt; 0, התהליך אינו ספונטני בתנאים אלה, והתהליך ההפוך הוא הספונטני.</p></div>
<p><b>דוגמה:</b> ליצירת אמוניה ב-298K: ΔH° = −92 kJ, ΔS°<sub>sys</sub> = −199 J/K.<br>
ΔS°<sub>surr</sub> = −(−92,000) ÷ 298 = +308.7 J/K<br>
ΔS°<sub>univ</sub> = −199 + 308.7 = <b class="pos">+109.7 J/K</b>, ולכן התגובה ספונטנית בטמפרטורה זו.</p>
</section>

function fitCanvas(cv, ratio) {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.max(240, cv.parentElement.clientWidth - 0);
  const h = Math.round(w * ratio);
  cv.style.height = h + 'px';
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

}

  let T = 300; const sl = $('#pT', box);
  sl.addEventListener('input', () => { const nT = +sl.value; const f = Math.sqrt(nT / T); [A, B].forEach(S => S.ps.forEach(p => { p.vx *= f; p.vy *= f; })); T = nT; $('#pTv', box).textContent = T; });
  const init = S => { const { w, h } = fitCanvas(S.cv, .62); S.w = w; S.h = h; S.ps = []; for (let i = 0; i < S.n; i++) { const sp = (0.6 + Math.random() * 1.2) * Math.sqrt(T / 300) * 1.4; const a = Math.random() * 6.283; S.ps.push({ x: 10 + Math.random() * (w - 20), y: 10 + Math.random() * (h - 20), vx: sp * Math.cos(a), vy: sp * Math.sin(a) }); } };

};

  [2.0, 0, 100, 'l', 'חימום המים הנוזליים: המולקולות נעות מהר יותר, הטמפרטורה עולה.'],
  [3.6, 100, 100, 'b', 'רתיחה ב-100°C: קטע ארוך! המולקולות מתרחקות מאוד (ΔH אידוי = +40.7 kJ/mol). לכן הקטע ארוך בהרבה מקטע ההתכה.'],

  let tt = 0, playing = false, last = 0, W1, H1, W2, H2, mols = [];
  const stateAt = t => { let acc = 0; for (let i = 0; i < seg.length; i++) { const s = seg[i]; if (t <= acc + s[0] || i === seg.length - 1) { const f = Math.min(1, (t - acc) / s[0]); return { i, f, T: s[1] + (s[2] - s[1]) * f, st: s[3] }; } acc += s[0]; } };
  const initM = () => { mols = []; const n = 20, cols = 5; for (let k = 0; k < n; k++) { const gx = (k % cols + .5) / cols, gy = (Math.floor(k / cols) + .5) / (n / cols); mols.push({ gx, gy, x: gx, y: gy, vx: (Math.random() - .5), vy: (Math.random() - .5) }); } };

    arrow(ctx, L, B, L, T - 4, c.muted, 1.5); arrow(ctx, L, B, R + 4, B, c.muted, 1.5);
    [-20, 0, 100, 120].forEach(v => { txt(ctx, v + '°', L - 18, Y(v), c.muted, 11); ctx.strokeStyle = c.line; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(L, Y(v)); ctx.lineTo(R, Y(v)); ctx.stroke(); });

    ctx.strokeStyle = c.line; ctx.lineWidth = 2.5; ctx.beginPath(); let acc = 0; seg.forEach((s, i) => { if (!i) ctx.moveTo(X(0), Y(s[1])); ctx.lineTo(X(acc + s[0]), Y(s[2])); acc += s[0]; }); ctx.stroke();
    ctx.strokeStyle = c.heat; ctx.lineWidth = 3.5; ctx.beginPath(); acc = 0; ctx.moveTo(X(0), Y(-20));

  ctr.addEventListener('click', e => { const a = e.target.dataset.a; if (a === 'play') { if (tt >= tot) { tt = 0; initM(); } playing = !playing; e.target.textContent = playing ? 'השהיה ❚❚' : 'המשך ▶'; } if (a === 'reset') { tt = 0; initM(); playing = false; $('[data-a=play]', ctr).textContent = 'הפעלה ▶'; } });

/* 5. Hess builder */
W.hess = box => {
  head(box, 'מעבדה אינטראקטיבית', 'בנו בעצמכם את מסלול חוק הס', true);
  box.insertAdjacentHTML('beforeend', `<p>מטרה: <span class="f">C(s) + ½O₂(g) → CO(g)</span>. הפכו ו/או הכפילו כל ניסוח, עד שהסכום נותן את תגובת המטרה.</p><div id="hrows" style="display:flex;flex-direction:column;gap:8px"></div><div class="caption" id="hsum"></div><div id="hver"></div>`);
  const eqs = [{ r: { 'C(s)': 1, 'O₂(g)': 1 }, p: { 'CO₂(g)': 1 }, dh: -393.5 }, { r: { 'CO(g)': 1, 'O₂(g)': .5 }, p: { 'CO₂(g)': 1 }, dh: -283.0 }];
  const st = eqs.map(() => ({ dir: 1, m: 1 }));
  const frac = v => v === .5 ? '½' : v === .25 ? '¼' : v === 1.5 ? '1½' : v === 1 ? '' : String(v);
  const side = o => Object.entries(o).map(([k, v]) => frac(v) + k).join(' + ');
  const rows = $('#hrows', box);
  const render = () => {
    rows.innerHTML = ''; const net = {};
    let sum = 0;
    eqs.forEach((e, i) => { const s = st[i]; const R = s.dir > 0 ? e.r : e.p, P = s.dir > 0 ? e.p : e.r; const sc = o => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, v * s.m]));
      const r2 = sc(R), p2 = sc(P); const dh = e.dh * s.dir * s.m; sum += dh;
      for (const k in r2) net[k] = (net[k] || 0) - r2[k]; for (const k in p2) net[k] = (net[k] || 0) + p2[k];
      const row = el('div', { class: 'hessrow' });
      row.innerHTML = `<button class="btn ghost" data-i="${i}" data-a="flip">הפיכה ⇄</button><label for="hm${i}">כפול <select id="hm${i}" data-i="${i}">${[.5, 1, 2].map(v => `<option value="${v}" ${v === s.m ? 'selected' : ''}>${v}</option>`).join('')}</select></label><div class="eq">(${i + 1}) ${side(r2)} → ${side(p2)} &nbsp; ΔH = ${fmt(dh)} kJ</div>`;
      rows.appendChild(row); });
    const re = [], pr = []; for (const k in net) { const v = Math.round(net[k] * 100) / 100; if (v < 0) re.push(frac(-v) + k); if (v > 0) pr.push(frac(v) + k); }

    const ok = st[0].dir === 1 && st[0].m === 1 && st[1].dir === -1 && st[1].m === 1;

/* 6. bonds animation */
W.bondsAnim = box => {

  const caps = ['מולקולת H₂ ומולקולת Cl₂. כל מולקולה מוחזקת בקשר קוולנטי.', 'שלב 1: שבירת הקשרים. משקיעים 436 kJ (H–H) + 243 kJ (Cl–Cl) = 679 kJ. שלב אנדותרמי.', 'שלב 2: יצירת שני קשרי H–Cl. משתחררים 2 × 432 = 864 kJ. שלב אקסותרמי.', 'סיכום: ΔH = 679 − 864 = −185 kJ. השתחרר יותר ממה שהושקע, ולכן התגובה אקסותרמית.'];

    const r1 = 16 * sc, r2 = 24 * sc;

    const sep = ph === 0 ? 0 : ph === 1 ? f : 1, join = ph < 2 ? 0 : ph === 2 ? f : 1;
    const base = { H1: [-40, -40], H2: [0, -40], C1: [-46, 40], C2: [6, 40] };
    const apart = { H1: [-110, -60], H2: [70, -60], C1: [-120, 60], C2: [80, 60] };
    const fin = { H1: [-110, -20], C1: [-110 + 52, -20], H2: [10, 20], C2: [10 + 52, 20] };

    H1 = pos('H1'); H2 = pos('H2'); C1 = pos('C1'); C2 = pos('C2');
    const bond = (a, b, col, alpha) => { ctx.globalAlpha = alpha; ctx.strokeStyle = col; ctx.lineWidth = 6 * sc; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); ctx.globalAlpha = 1; };
    if (sep < 1) { bond(H1, H2, c.ink, 1 - sep); bond(C1, C2, c.ink, 1 - sep); }
    if (join > 0) { bond(H1, C1, c.good, join); bond(H2, C2, c.good, join); }
    const atom = (p, r, col, s) => { ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, 6.283); ctx.fillStyle = col; ctx.fill(); txt(ctx, s, p[0], p[1] + 1, c.surface, 13 * sc + 2, 'center', true); };

    if (ph === 2) for (let k = 0; k < 3; k++) { const x = ax + (-150 + k * 110) * sc; const y0 = H_ * .92 - ((f * 60 + k * 20) % 40); ctx.globalAlpha = .8; arrow(ctx, x, y0, x, y0 + 24, c.heat, 3); ctx.globalAlpha = 1; }

    ctx.fillStyle = c.line; ctx.fillRect(lx, H_ * .2 + 10, lw, bh); ctx.fillStyle = c.cold; ctx.fillRect(lx, H_ * .2 + 10, lw * val1 / maxE, bh); txt(ctx, Math.round(val1) + ' kJ', lx + 4, H_ * .2 + 10 + bh / 2, c.ink, 12, 'left', true);
    txt(ctx, 'משתחרר ביצירה', lx + lw, H_ * .5, c.ink, 12, 'right', true);
    ctx.fillStyle = c.line; ctx.fillRect(lx, H_ * .5 + 10, lw, bh); ctx.fillStyle = c.heat; ctx.fillRect(lx, H_ * .5 + 10, lw * val2 / maxE, bh); txt(ctx, Math.round(val2) + ' kJ', lx + 4, H_ * .5 + 10 + bh / 2, c.ink, 12, 'left', true);

  return { start() { const r = fitCanvas(cv, .5); W_ = r.w; H_ = r.h; last = 0; L.start(); }, stop() { L.stop(); playing = false; } };

/* 7. collisions simulation + energy distribution */
W.collisions = box => {
  head(box, 'הדמיה', 'מודל ההתנגשויות במעבדה וירטואלית', true);
  const cv = el('canvas'); box.appendChild(cv);
  const ctr = el('div', { class: 'controls' }, `<label for="cT">טמפרטורה <input id="cT" type="range" min="200" max="600" value="300"></label><label for="cN">ריכוז <input id="cN" type="range" min="6" max="40" value="16"></label><label for="cK"><input id="cK" type="checkbox"> זרז</label><button class="btn ghost" data-a="reset">איפוס</button>`);
  box.appendChild(ctr);
  const ro = el('div', { class: 'readout' }); box.appendChild(ro);
  const dv = el('canvas'); box.appendChild(dv);
  box.appendChild(el('p', { class: 'caption' }, 'כחול + כתום = מגיבים. ירוק = תוצר. רק התנגשות עם אנרגיה ≥ Ea מבזיקה ויוצרת תוצר. בגרף התחתון: השטח הצבוע מימין לקו Ea הוא חלק החלקיקים שיש להם מספיק אנרגיה. נסו להעלות טמפרטורה או להוסיף זרז.'));
  let W_, H_, W2, H2, ps = [], flashes = [], made = 0, t0 = 0, hist = [];
  const T = () => +$('#cT', box).value, N = () => +$('#cN', box).value, Ea = () => ($('#cK', box).checked ? 3.2 : 6.0);
  const reset = () => { ps = []; made = 0; flashes = []; t0 = performance.now(); hist = []; const n = N(); for (let i = 0; i < n * 2; i++) { const s = Math.sqrt(T() / 300) * (0.5 + Math.random()) * 1.6, a = Math.random() * 6.283; ps.push({ x: 12 + Math.random() * (W_ - 24), y: 12 + Math.random() * (H_ - 24), vx: s * Math.cos(a), vy: s * Math.sin(a), k: i % 2 }); } };
  let lastT = 300;
  ['cT', 'cN'].forEach(id => $('#' + id, box).addEventListener('input', () => { if (id === 'cT') { const f = Math.sqrt(T() / lastT); ps.forEach(p => { p.vx *= f; p.vy *= f; }); lastT = T(); } else reset(); }));
  ctr.addEventListener('click', e => { if (e.target.dataset.a === 'reset') reset(); });
  const drawDist = () => {
    const c = colors(), ctx = dv.getContext('2d'); ctx.clearRect(0, 0, W2, H2);
    const L = 36, R = W2 - 12, Tp = 12, B = H2 - 24; const Emax = 14; const kT = T() / 300 * 1.6;
    const f = E => Math.sqrt(E) * Math.exp(-E / kT) / Math.pow(kT, 1.5);
    let mx = 0; for (let i = 1; i <= 200; i++) mx = Math.max(mx, f(i / 200 * Emax));
    const mxRef = (() => { let m = 0; const k = 200 / 300 * 1.6; for (let i = 1; i <= 200; i++) { const E = i / 200 * Emax; m = Math.max(m, Math.sqrt(E) * Math.exp(-E / k) / Math.pow(k, 1.5)); } return m; })();
    const X = E => L + E / Emax * (R - L), Y = v => B - v / mxRef * (B - Tp) * .95;
    arrow(ctx, L, B, L, Tp - 2, c.muted, 1.5); arrow(ctx, L, B, R + 4, B, c.muted, 1.5);
    txt(ctx, 'אנרגיה קינטית', (L + R) / 2, H2 - 8, c.muted, 11);
    ctx.save(); ctx.translate(12, (Tp + B) / 2); ctx.rotate(-Math.PI / 2); txt(ctx, 'מספר חלקיקים', 0, 0, c.muted, 11); ctx.restore();
    const ea = Ea() * 1.0;
    ctx.beginPath(); ctx.moveTo(X(ea), B); for (let i = 0; i <= 200; i++) { const E = ea + i / 200 * (Emax - ea); ctx.lineTo(X(E), Y(f(E))); } ctx.lineTo(X(Emax), B); ctx.closePath(); ctx.fillStyle = c.heat; ctx.globalAlpha = .35; ctx.fill(); ctx.globalAlpha = 1;
    ctx.beginPath(); for (let i = 0; i <= 200; i++) { const E = i / 200 * Emax; i ? ctx.lineTo(X(E), Y(f(E))) : ctx.moveTo(X(E), Y(f(E))); } ctx.strokeStyle = c.ink; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.setLineDash([5, 4]); ctx.strokeStyle = $('#cK', box).checked ? c.good : c.cold; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(X(ea), Tp); ctx.lineTo(X(ea), B); ctx.stroke(); ctx.setLineDash([]);
    txt(ctx, 'Ea', X(ea) + 14, Tp + 8, $('#cK', box).checked ? c.good : c.cold, 13, 'center', true);
    let num = 0, den = 0; for (let i = 1; i <= 400; i++) { const E = i / 400 * 30; const v = f(E); den += v; if (E >= ea) num += v; }
    return num / den;
  };
  const L = loop(now => {
    const c = colors(), ctx = cv.getContext('2d'); ctx.clearRect(0, 0, W_, H_);
    const ea = Ea(), r = 7;
    for (const p of ps) { p.x += p.vx; p.y += p.vy; if (p.x < r || p.x > W_ - r) p.vx *= -1; if (p.y < r || p.y > H_ - r) p.vy *= -1; p.x = Math.min(Math.max(p.x, r), W_ - r); p.y = Math.min(Math.max(p.y, r), H_ - r); }
    for (let i = 0; i < ps.length; i++) for (let j = i + 1; j < ps.length; j++) {
      const a = ps[i], b = ps[j]; const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy; if (d2 > 4 * r * r || d2 === 0) continue;
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d; const rel = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny; if (rel <= 0) continue;

      a.vx -= rel * nx; a.vy -= rel * ny; b.vx += rel * nx; b.vy += rel * ny;

    for (const p of ps) { ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.283); ctx.fillStyle = p.k === 0 ? c.cold : p.k === 1 ? c.heat : c.good; ctx.fill(); }

    const frac = drawDist();
    const secs = (performance.now() - t0) / 1000;
    const left = ps.filter(p => p.k < 2).length / 2;
    ro.innerHTML = `<span>T = <b>${T()}</b> K</span><span>חלקיקים עם E ≥ Ea: <b>${(frac * 100).toFixed(1)}%</b></span><span>תוצרים שנוצרו: <b>${made}</b></span><span>זוגות מגיבים שנותרו: <b>${left}</b></span><span>זמן: <b>${secs.toFixed(0)}</b> שנ'</span>`;
  });
  return { start() { let r = fitCanvas(cv, .45); W_ = r.w; H_ = r.h; r = fitCanvas(dv, .3); W2 = r.w; H2 = r.h; lastT = T(); reset(); L.start(); }, stop() { L.stop(); } };
};

/* 8. entropy spread */

/* ================= hero: thermal camera energy landscape ================= */

<section class="blk"><h2>תגובות הפיכות</h2>
<p>תגובות רבות אינן מתרחשות עד תום. בכלי סגור, התוצרים יכולים להגיב זה עם זה וליצור שוב את המגיבים. תגובה כזו נקראת <b>תגובה הפיכה</b>, ומסמנים אותה בחץ כפול:</p>
<div class="eq">H<sub>2</sub>(g) + Br<sub>2</sub>(g) ⇌ 2HBr(g)</div>
<ul><li><b>התגובה הישירה</b>: משמאל לימין, מהמגיבים לתוצרים.</li>
<li><b>התגובה ההפוכה</b>: מימין לשמאל, מהתוצרים בחזרה למגיבים.</li></ul>
</section>
<section class="blk"><h2>שיווי משקל דינמי</h2>
<p>בתחילת התגובה יש הרבה מגיבים, ולכן קצב התגובה הישירה גבוה. ככל שנוצרים תוצרים, קצב התגובה ההפוכה עולה. בשלב מסוים שני הקצבים <b>משתווים</b>, וזהו מצב של <b>שיווי משקל</b>.</p>
<div class="split">
<div class="cardlet"><h4>ברמה המאקרוסקופית</h4><p>נראה כאילו "שום דבר לא קורה": הצבע, הלחץ, הטמפרטורה והריכוזים נשארים קבועים לאורך זמן.</p></div>
<div class="cardlet"><h4>ברמה המיקרוסקופית</h4><p>שתי התגובות ממשיכות להתרחש כל הזמן, <b>באותו קצב</b>. בכל שנייה נוצרות מולקולות HBr ובאותה שנייה מתפרק מספר שווה שלהן.</p></div>
</div>
<div class="key"><h3>שיווי משקל הוא דינמי</h3><p>במצב שיווי משקל התגובה לא נעצרה. הריכוזים קבועים, אבל <b>לא בהכרח שווים</b>, כי שתי התגובות מתרחשות באותו קצב.</p></div>
<div class="warn"><h3>בתוכנית הלימודים</h3><p>עוסקים רק במערכות <b>הומוגניות</b>: כל המרכיבים באותו מצב צבירה (למשל, כולם גזים). שיווי משקל דורש <b>כלי סגור</b>, אחרת חומר יוצא מהמערכת.</p></div>
</section>

<section class="blk"><h2>מולי גז ולחץ</h2>
<p>בכלי סגור בטמפרטורה קבועה, הלחץ תלוי במספר מולי הגז. אם בתגובה משתנה מספר מולי הגז, הלחץ בכלי משתנה עד שמגיעים לשיווי משקל, ואז נשאר קבוע.</p>
<ul><li><span class="f">N₂(g) + 3H₂(g) ⇌ 2NH₃(g)</span>: מ-4 מולי גז ל-2. כשהתגובה הישירה מתקדמת, הלחץ יורד.</li>
<li><span class="f">H₂(g) + Br₂(g) ⇌ 2HBr(g)</span>: 2 מולי גז בכל צד. הלחץ לא משתנה במהלך התגובה.</li></ul>
</section>
<section class="blk"><h2>קבוע שיווי המשקל K<sub>c</sub></h2>
<p>במצב שיווי משקל, היחס בין ריכוזי התוצרים לריכוזי המגיבים הוא מספר קבוע. לתגובה כללית:</p>
<div class="eq">aA + bB ⇌ cC + dD &nbsp;&nbsp;⇒&nbsp;&nbsp; Kc = [C]<sup>c</sup>·[D]<sup>d</sup> / ([A]<sup>a</sup>·[B]<sup>b</sup>)</div>
<ul><li>במונה: ריכוזי התוצרים, כל אחד בחזקת המקדם שלו בניסוח. במכנה: המגיבים.</li>
<li>הריכוזים הם ריכוזים <b>במצב שיווי משקל</b>, ב-M. נהוג לרשום את K<sub>c</sub> ללא יחידות.</li>
<li>K<sub>c</sub> תלוי <b>רק בטמפרטורה</b>. שינוי בריכוזים ההתחלתיים לא משנה אותו.</li></ul>
<div class="tblwrap"><table><thead><tr><th>ערך K<sub>c</sub></th><th>משמעות</th></tr></thead><tbody>
<tr><td class="num">K &gt; 10¹⁰</td><td>כמעט רק תוצרים. מעשית, התגובה מתרחשת עד תום.</td></tr>
<tr><td class="num">K &gt; 1</td><td>במצב שיווי משקל יש יותר תוצרים ממגיבים.</td></tr>
<tr><td class="num">0.01 &lt; K &lt; 100</td><td>מגיבים ותוצרים בכמויות מורגשות: שיווי משקל "ברור".</td></tr>
<tr><td class="num">K &lt; 1</td><td>יש יותר מגיבים מתוצרים.</td></tr>
<tr><td class="num">K &lt; 10⁻¹⁰</td><td>כמעט רק מגיבים. מעשית, התגובה כמעט לא מתרחשת.</td></tr>
</tbody></table></div>
</section>
<section class="blk"><h2>דוגמה פתורה: טבלת ריכוזים</h2>
<p>לכלי סגור שנפחו 1 ליטר הכניסו 1 מול מכל אחד מהחומרים H<sub>2</sub>, Br<sub>2</sub> ו-HBr. במצב שיווי משקל נמצאו בכלי 1.8 מול HBr. מהו K<sub>c</sub>?</p>

<section class="blk"><h2>מנת הריכוזים Q</h2>
<p><b>מנת הריכוזים Q</b> מחושבת בדיוק כמו K<sub>c</sub>, אבל עם הריכוזים <b>ברגע כלשהו</b>, גם כשהמערכת עוד לא בשיווי משקל. ההשוואה בין Q ל-K<sub>c</sub> מנבאת לאן תתקדם התגובה:</p>

<div class="cardlet"><h4>Q = Kc</h4><p>המערכת <b>בשיווי משקל</b>.</p></div>
<div class="cardlet"><h4>Q &gt; Kc</h4><p>יש "יותר מדי" תוצרים. התגובה <b>ההפוכה</b> תגבר עד ש-Q יקטן ל-K<sub>c</sub>.</p></div>

<p>אפשר להסביר שינוי בריכוז בשלוש דרכים: <b>מודל ההתנגשויות</b> (יותר חלקיקי מגיב, יותר התנגשויות, קצב ישיר גבוה יותר), <b>השוואת Q ל-K<sub>c</sub></b>, או <b>עקרון לה שטלייה</b>.</p>
<p><b>דוגמה מהתעשייה:</b> בתהליך הָבֶּר לייצור אמוניה, <span class="f">N₂(g) + 3H₂(g) ⇌ 2NH₃(g)   ΔH &lt; 0</span>. התגובה הישירה אקסותרמית, ולכן חימום מקטין את K<sub>c</sub>. ובכל זאת עובדים בטמפרטורה גבוהה יחסית ועם זרז, כדי שהתגובה תהיה מהירה מספיק. זו פשרה בין שיווי משקל לקצב.</p>

  <button class="btn ghost" data-a="addA">הוספת מגיב A</button><button class="btn ghost" data-a="addB">הוספת תוצר B</button><button class="btn ghost" data-a="heat">חימום</button><button class="btn ghost" data-a="cool">קירור</button><button class="btn ghost" data-a="cat">זרז</button><button class="btn" data-a="reset">התחלה מחדש</button>`);

  let ps = [], hist = [], kf, kr, T, cat, W1, H1, W2, H2, tick = 0, flashes = [], msg = '';
  const N0 = 80;
  const reset = () => { kf = 0.012; kr = 0.006; T = 0; cat = 1; ps = Array.from({ length: N0 }, () => mk(0)); hist = []; tick = 0; msg = ''; };
  const mk = s => { const a = Math.random() * 6.283, v = 0.6 + Math.random() * 0.8; return { x: 8 + Math.random() * ((W1 || 200) - 16), y: 8 + Math.random() * ((H1 || 200) - 16), vx: v * Math.cos(a), vy: v * Math.sin(a), s }; };
  ctr.addEventListener('click', e => {
    const a = e.target.dataset.a; if (!a) return; const exo = $('#eqH', box).value === 'exo';
    if (a === 'reset') reset();
    if (a === 'addA') { for (let i = 0; i < 30; i++) ps.push(mk(0)); msg = 'הוספתם מגיב: Q קטן מ-K, ולכן התגובה הישירה גוברת עד שיווי משקל חדש. K לא השתנה.'; }
    if (a === 'addB') { for (let i = 0; i < 30; i++) ps.push(mk(1)); msg = 'הוספתם תוצר: Q גדול מ-K, ולכן התגובה ההפוכה גוברת. K לא השתנה.'; }
    if (a === 'heat' && T < 2) { T++; if (exo) { kf *= 1.3; kr *= 2.2; } else { kf *= 2.2; kr *= 1.3; } msg = exo ? 'חימום: גוברת התגובה האנדותרמית, כאן ההפוכה. K קטן, ויש פחות B בשיווי המשקל החדש.' : 'חימום: גוברת התגובה האנדותרמית, כאן הישירה. K גדל, ויש יותר B.'; }
    if (a === 'cool' && T > -2) { T--; if (exo) { kf /= 1.3; kr /= 2.2; } else { kf /= 2.2; kr /= 1.3; } msg = exo ? 'קירור: גוברת התגובה האקסותרמית, כאן הישירה. K גדל.' : 'קירור: גוברת התגובה האקסותרמית, כאן ההפוכה. K קטן.'; }

    if (ps.length > 220) ps = ps.slice(ps.length - 220);

    for (const p of ps) {
      p.x += p.vx; p.y += p.vy; if (p.x < 6 || p.x > W1 - 6) p.vx *= -1; if (p.y < 6 || p.y > H1 - 6) p.vy *= -1; p.x = Math.min(Math.max(p.x, 6), W1 - 6); p.y = Math.min(Math.max(p.y, 6), H1 - 6);
      const pr = p.s === 0 ? kf * cat : kr * cat;
      if (Math.random() < pr) { p.s = 1 - p.s; flashes.push({ x: p.x, y: p.y, t: 0, s: p.s }); }
      ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, 6.283); ctx.fillStyle = p.s ? c.heat : c.cold; ctx.fill();
    }

    const nA = ps.filter(p => !p.s).length, nB = ps.length - nA;
    if (tick % 4 === 0) { hist.push([nA, nB]); if (hist.length > 300) hist.shift(); }
    ctx = gv.getContext('2d'); ctx.clearRect(0, 0, W2, H2);
    const Lx = 34, R = W2 - 10, Tp = 10, B = H2 - 22; const mx = Math.max(100, ...hist.map(h => Math.max(h[0], h[1])));
    arrow(ctx, Lx, B, Lx, Tp - 2, c.muted, 1.5); arrow(ctx, Lx, B, R + 4, B, c.muted, 1.5);

    [[0, c.cold, 'A'], [1, c.heat, 'B']].forEach(([k, col, lb]) => { ctx.beginPath(); hist.forEach((h, i) => { const x = Lx + i / 300 * (R - Lx), y = B - h[k] / mx * (B - Tp); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.strokeStyle = col; ctx.lineWidth = 2.5; ctx.stroke(); if (hist.length) { const h = hist[hist.length - 1]; txt(ctx, lb, Lx + (hist.length - 1) / 300 * (R - Lx) + 9, B - h[k] / mx * (B - Tp), col, 12, 'center', true); } });
    const K = kf / kr, Q = nA ? nB / nA : Infinity; const rec = hist.slice(-30), mA = rec.reduce((t, h) => t + h[0], 0) / (rec.length || 1), mB = rec.reduce((t, h) => t + h[1], 0) / (rec.length || 1), Qs = mA ? mB / mA : Infinity;
    const stable = rec.length >= 30 && Math.abs(Qs - K) / K < 0.15;
    ro.innerHTML = `<span>[A] ∝ <b>${nA}</b></span><span>[B] ∝ <b>${nB}</b></span><span>Q = [B]/[A] = <b>${isFinite(Q) ? Q.toFixed(2) : '∞'}</b></span><span>K = <b>${K.toFixed(2)}</b></span><span><b>${stable ? 'בשיווי משקל: Q ≈ K (תנודות קטנות הן טבעיות)' : Qs < K ? 'Q &lt; K: הישירה גוברת' : 'Q &gt; K: ההפוכה גוברת'}</b></span>`;
    if (msg) cap.textContent = msg;
  });
  return { start() { let r = fitCanvas(pv, .9); W1 = r.w; H1 = r.h; r = fitCanvas(gv, .56); W2 = r.w; H2 = r.h; if (H1 > H2 * 1.1) { r = fitCanvas(pv, H2 / W1); W1 = r.w; H1 = r.h; } reset(); L.start(); }, stop() { L.stop(); } };
};

W.kcalc = box => {
  head(box, 'מחשבון', 'טבלת ריכוזים, Kc ו-Q', true);
  box.insertAdjacentHTML('beforeend', `<div class="eq">H<sub>2</sub>(g) + Br<sub>2</sub>(g) ⇌ 2HBr(g) &nbsp; (כלי של 1 ליטר)</div>

  <div id="kout"></div>
  <p><b>שלב ב:</b> ריכוזים ברגע כלשהו. האם המערכת בשיווי משקל, ולאן תתקדם?</p>
  <div class="controls"><label for="qh">[H₂] <input id="qh" type="number" min="0" step="0.1" value="0.5"></label><label for="qb">[Br₂] <input id="qb" type="number" min="0" step="0.1" value="0.5"></label><label for="qx">[HBr] <input id="qx" type="number" min="0" step="0.1" value="2"></label></div>
  <div class="caption" id="qout2"></div>`);
  let K = null;
  const n = id => parseFloat($(id, box).value);
  const upd = () => {
    const h0 = n('#k0h'), b0 = n('#k0b'), x0 = n('#k0x'), xe = n('#keq');
    let html = '';
    if ([h0, b0, x0, xe].some(v => isNaN(v) || v < 0)) { html = '<div class="verdict no">מלאו מספרים לא שליליים.</div>'; K = null; }
    else {
      const dx = xe - x0, d = dx / 2, he = h0 - d, be = b0 - d;
      if (he <= 0 || be <= 0) { html = `<div class="verdict no">לא ייתכן: לפי יחס המולים, [H₂] ו-[Br₂] בשיווי משקל יוצאים ${he.toFixed(2)} ו-${be.toFixed(2)}. ריכוז חייב להיות חיובי.</div>`; K = null; }
      else { K = xe * xe / (he * be); const f = v => (v > 0 ? '+' : '') + (+v.toFixed(3));

        <tr><td>שינוי (M)</td><td class="num">${f(-d)}</td><td class="num">${f(-d)}</td><td class="num">${f(dx)}</td></tr>
        <tr><td>שיווי משקל (M)</td><td class="num">${+he.toFixed(3)}</td><td class="num">${+be.toFixed(3)}</td><td class="num">${xe}</td></tr></tbody></table></div>

    }

    const Q = qx * qx / (qh * qb), rel = Math.abs(Q - K) / K;
    out.innerHTML = `Q = ${qx}² / (${qh} × ${qb}) = <b>${+Q.toFixed(3)}</b>, ו-Kc = <b>${+K.toFixed(3)}</b>. ` + (rel < 0.02 ? 'Q = Kc: המערכת <b>בשיווי משקל</b>.' : Q < K ? 'Q &lt; Kc: <b>התגובה הישירה</b> תגבר, ייווצר עוד HBr.' : 'Q &gt; Kc: <b>התגובה ההפוכה</b> תגבר, HBr יתפרק.');
  };
  box.addEventListener('input', upd); upd(); return {};
};

}

function shuffleQ(q) { const idx = q.o.map((_, i) => i); for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; } return { q: q.q, o: idx.map(i => q.o[i]), a: idx.indexOf(q.a), e: q.e }; }
function runQuiz(c, host) {
  const qs = c.quiz.map(shuffleQ); let i = 0; const res = [];
  const panel = el('section', { class: 'panel quiz' }); host.innerHTML = ''; host.appendChild(panel);
  const show = () => {
    const q = qs[i];
    panel.innerHTML = `<div class="dots" aria-hidden="true">${qs.map((_, k) => `<span class="dot ${k < res.length ? (res[k] ? 'ok' : 'no') : ''} ${k === i ? 'cur' : ''}"></span>`).join('')}</div>
    <p class="eyebrow">שאלה ${i + 1} מתוך ${qs.length}</p><p class="qtext">${q.q}</p>
    <div class="opts">${q.o.map((o, k) => `<button class="opt" data-k="${k}"><span class="lt">${'אבגד'[k]}.</span><span>${o}</span></button>`).join('')}</div><div id="fb" aria-live="polite"></div>`;
    panel.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => {
      const k = +b.dataset.k, ok = k === q.a; res.push(ok);
      panel.querySelectorAll('.opt').forEach((x, j) => { x.disabled = true; if (j === q.a) x.classList.add('ok'); else if (j === k) x.classList.add('no'); });
      $('#fb', panel).innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}"><strong>${ok ? pick(PRAISE) : pick(ENCOURAGE)}</strong><span>${q.e}</span></div><div style="margin-top:10px"><button class="btn" id="qnext">${i < qs.length - 1 ? 'לשאלה הבאה' : 'לסיכום הבוחן'}</button></div>`;
      panel.querySelectorAll('.dot')[i].classList.add(ok ? 'ok' : 'no');
      const nb = $('#qnext', panel); nb.focus({ preventScroll: true });
      nb.addEventListener('click', () => { i++; if (i < qs.length) { show(); panel.scrollIntoView({ behavior: RM ? 'auto' : 'smooth', block: 'start' }); } else finish(); });
    }));
  };
  const finish = () => {
    const score = res.filter(Boolean).length, d = chs(c.id);
    d.last = score; d.best = Math.max(d.best || 0, score); d.tries++; save(); buildNav();

    const msg = score === 10 ? `${hi()}10 מתוך 10! שליטה מלאה בפרק. אתם מוכנים להמשיך, ואולי גם לעזור לחבר/ה בכיתה.` :
      score >= 8 ? `${hi()}תוצאה מצוינת. ההבנה שלכם יציבה. עברו על ההסברים של השאלות שפספסתם, וזהו.` :
      score >= 6 ? `${hi()}בסיס טוב. יש כמה נקודות שעוד לא התיישבו. חזרו לחלקים הרלוונטיים בפרק, הפעילו שוב את ההדמיה ונסו את הבוחן פעם נוספת.` :
      `${hi()}זה בדיוק השלב שבו לומדים הכי הרבה. אל תוותרו! קראו שוב את הפרק לאט, עם ההדמיות, ונסו שוב. אם משהו לא מסתדר, כתבו לי במשוב למטה.`;
    const calib = d.conf >= 4 && score < 6 ? 'הרגשתם בטוחים, אבל הבוחן הראה שיש פערים. זה מידע חשוב: כדאי לבדוק איפה ההבנה עדיין לא מדויקת.' : d.conf <= 2 && score >= 8 ? 'לפני הבוחן הרגשתם לא בטוחים, ובפועל הצלחתם מאוד. אתם יודעים יותר ממה שאתם חושבים!' : '';
    const wrong = qs.map((q, k) => [q, res[k]]).filter(x => !x[1]);
    panel.innerHTML = `<p class="eyebrow">סיכום הבוחן</p><div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap"><span class="score">${score}/10</span><span>${score >= 8 ? 'שליטה טובה' : score >= 6 ? 'בדרך הנכונה' : 'שווה לחזור על הפרק'}</span></div>
    ${teacher(msg + (calib ? ' ' + calib : ''))}
    ${wrong.length ? `<details><summary style="cursor:pointer;font-weight:700">השאלות לחזרה (${wrong.length})</summary><ol style="margin-top:8px">${wrong.map(([q]) => `<li><b>${q.q}</b><br>תשובה נכונה: ${q.o[q.a]}<br><span style="color:var(--muted)">${q.e}</span></li>`).join('')}</ol></details>` : ''}

    $('#fsend', panel).addEventListener('click', () => {

      const parts = [];

      else if (d.mood === 2) parts.push(`${hi()}תודה על המשוב.`);
      else parts.push(`${hi()}שמח לשמוע שהרגשתם טוב בפרק!`);
      if (d.hard.includes('החישובים')) parts.push('לגבי החישובים: נסו את המחשבון בפרק, קודם במחברת ואז לבדוק. בשיעור נתרגל יחד עוד דוגמאות.');
      if (d.hard.includes('המושגים')) parts.push('לגבי המושגים: כדאי לכתוב לכל מושג משפט אחד במילים שלכם ודוגמה אחת מהיום־יום.');
      if (d.hard.includes('הגרפים')) parts.push('לגבי הגרפים: הפעילו שוב את סרטון האנימציה והשהו בכל שלב. שאלו את עצמכם מה מייצג כל ציר.');

/* ================= report ================= */
function reportText() {
  const L = [];
  L.push('דוח למידה: אנרגיה בקצב הכימיה');
  L.push('שם: ' + (S.name || '(לא הוזן)'));
  L.push('תאריך: ' + new Date().toLocaleDateString('he-IL'));
  if (S.startMood != null) L.push('הרגשה בתחילת היחידה: ' + MOODS[S.startMood][1]);
  L.push('');
  CHAPTERS.forEach((c, i) => {
    const d = S.ch[c.id];
    L.push(`פרק ${i + 1}: ${c.title}`);
    if (!d || d.best == null) { L.push('  טרם נבחן'); L.push(''); return; }
    L.push(`  ציון אחרון: ${d.last}/10 | ציון הטוב ביותר: ${d.best}/10 | ניסיונות: ${d.tries}`);
    if (d.conf) L.push(`  ביטחון לפני הבוחן: ${d.conf}/5`);
    if (d.mood != null) L.push('  הרגשה: ' + MOODS[d.mood][1]);
    if (d.hard && d.hard.length) L.push('  היה קשה: ' + d.hard.join(', '));
    if (d.note) L.push('  הערה: ' + d.note);
    L.push('');
  });
  const done = CHAPTERS.filter(c => S.ch[c.id] && S.ch[c.id].best != null);
  if (S.known) { const core = DECK.filter(d => !d.x).length, k = DECK.filter((d, i) => !d.x && S.known[i]).length; if (k) L.push(`כרטיסיות: ידעתי ${k} מתוך ${core} כרטיסי הליבה`); }
  if (done.length) L.push(`ממוצע (ציון הטוב ביותר): ${(done.reduce((a, c) => a + S.ch[c.id].best, 0) / done.length).toFixed(1)}/10 ב-${done.length} פרקים`);
  return L.join('\n');
}
function renderReport() {
  const v = el('div', { class: 'view' });
  const done = CHAPTERS.filter(c => S.ch[c.id] && S.ch[c.id].best != null).length;
  v.innerHTML = `<p class="eyebrow">סיכום</p><h1>הדוח שלי למורה</h1>
  <p class="lead">${done === CHAPTERS.length ? `${hi()}השלמתם את כל ${CHAPTERS.length} הפרקים. כל הכבוד על ההתמדה!` : `השלמתם ${done} מתוך ${CHAPTERS.length} פרקים. אפשר לשלוח דוח חלקי ולהמשיך אחר כך.`}</p>
  <section class="panel"><h2>שליחת הדוח</h2><p>העתיקו את הדוח והדביקו אותו בהודעה למורה (בקלאסרום, במייל או בוואטסאפ), או שמרו אותו כקובץ.</p>
  <div class="report" id="rep" tabindex="0"></div>
  <div class="controls"><button class="btn" id="rcopy">העתקת הדוח</button><button class="btn ghost" id="rdl">שמירה כקובץ</button><span id="rmsg" aria-live="polite"></span></div></section>
  <section class="panel"><h2>מחשבה אחרונה</h2><label for="final" style="font-weight:700">מה הדבר החשוב ביותר שלמדתם ביחידה הזו?</label><textarea id="final">${S.final || ''}</textarea></section>
  <div><button class="btn ghost" id="rreset">איפוס כל ההתקדמות</button> <span id="rconf"></span></div>`;
  view.appendChild(v);
  const upd = () => { $('#rep', v).textContent = reportText() + (S.final ? '\n\nהדבר החשוב ביותר שלמדתי: ' + S.final : ''); };
  upd();
  $('#final', v).addEventListener('input', e => { S.final = e.target.value.trim(); save(); upd(); });
  $('#rcopy', v).addEventListener('click', () => { const t = $('#rep', v).textContent; const sel = () => { const r = document.createRange(); r.selectNodeContents($('#rep', v)); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $('#rmsg', v).textContent = 'הטקסט מסומן. העתיקו עם Ctrl+C.'; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(() => { $('#rmsg', v).textContent = 'הדוח הועתק.'; }, sel); else sel(); });
  $('#rdl', v).addEventListener('click', () => { try { const b = new Blob(['﻿' + $('#rep', v).textContent], { type: 'text/plain;charset=utf-8' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'דוח-אנרגיה-' + (S.name || 'תלמיד') + '.txt'; document.body.appendChild(a); a.click(); a.remove(); $('#rmsg', v).textContent = 'אם הקובץ לא ירד, השתמשו בכפתור ההעתקה.'; } catch (e) { $('#rmsg', v).textContent = 'השמירה לא זמינה כאן. השתמשו בכפתור ההעתקה.'; } });
  $('#rreset', v).addEventListener('click', e => { const c = $('#rconf', v); if (!c.dataset.ask) { c.dataset.ask = '1'; c.innerHTML = 'בטוחים? כל הציונים והמשובים יימחקו. <button class="btn heat" id="rreset2">כן, לאפס</button>'; $('#rreset2', v).addEventListener('click', () => { S = { name: '', startMood: null, ch: {} }; save(); buildNav(); go('home'); }); } });
}

/* ================= boot ================= */
$('#themebtn').addEventListener('click', () => { setTimeout(() => { buildNav(); }, 0); const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; });
let rz, lastW = window.innerWidth; window.addEventListener('resize', () => { if (Math.abs(window.innerWidth - lastW) < 30) return; lastW = window.innerWidth; clearTimeout(rz); rz = setTimeout(() => { active.forEach(a => { if (a.stop && a.start) { a.stop(); a.start(); } }); }, 250); });
/* ================= teacher notifications (Google Apps Script web app) ================= */
const NOTIFY_URL = 'https://script.google.com/macros/s/AKfycbxyB4rh51E_-HveYOvXTh_hRbYMwjR94kSQN34TgeniNSUPgrIZD797NbNwrca05PKZPw/exec';
function notify(type, data) {
  if (!NOTIFY_URL || !S.name) return;
  const body = Object.assign({ type, name: S.name.slice(0, 60), device: /Mobi|Android|iPhone/i.test(navigator.userAgent) ? 'טלפון' : 'מחשב', visits: S.visits || 1 }, data || {});
  try { fetch(NOTIFY_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), keepalive: true }).catch(() => {}); } catch (e) {}
}
function notifyEntry() {
  let sent = false; try { sent = sessionStorage.getItem('ec-entry') === '1'; } catch (e) {}
  if (sent || !S.name) return;
  try { sessionStorage.setItem('ec-entry', '1'); } catch (e) {}
  const done = CHAPTERS.filter(c => S.ch[c.id] && S.ch[c.id].best != null).length;
  notify('entry', { details: `השלים ${done} מתוך ${CHAPTERS.length} תחנות` });
}
let nameTimer;
S.visits = (S.visits || 0) + 1; save();
buildNav();
const startId = (location.hash || '').slice(1);
go(['home', 'report', 'map', 'cards'].concat(CHAPTERS.map(c => c.id)).includes(startId) ? startId : 'home', true);

/* ================= mind map ================= */
function renderMap() {
  const v = el('div', { class: 'view' });
  v.innerHTML = `<p class="eyebrow">מבט על</p><h1>מפת חשיבה</h1><p class="lead">כל היחידה במפה אחת. לחצו על ענף כדי לפתוח או לסגור אותו. לחיצה על "לפרק" מעבירה להסבר המלא.</p>
  <div class="controls"><button class="btn ghost" id="mOpen">פתיחת כל הענפים</button><button class="btn ghost" id="mClose">סגירת כל הענפים</button></div><div class="mmwrap"><ul class="mm" id="mm"></ul></div>`;
  view.appendChild(v);
  const build = (n, depth) => {
    const li = el('li', { class: 'd' + depth });
    const has = n.k && n.k.length;
    const node = el('div', { class: 'mnode' + (has ? ' has' : '') });
    node.innerHTML = `${has ? `<button class="mtog" aria-expanded="${depth < 1 ? 'true' : 'false'}">${n.t}</button>` : `<span${n.f ? ' class="f" dir="ltr"' : ''}>${n.t.replace(/</g, '&lt;')}</span>`}${n.go ? ` <button class="mgo" data-go="${n.go}">לפרק</button>` : ''}`;
    li.appendChild(node);
    if (has) { const ul = el('ul'); ul.hidden = depth >= 1; n.k.forEach(k => ul.appendChild(build(k, depth + 1))); li.appendChild(ul); }
    return li;
  };
  $('#mm', v).appendChild(build(MAP, 0));
  v.addEventListener('click', e => { const t = e.target.closest('.mtog'); if (!t) return; const ul = t.closest('li').querySelector(':scope > ul'); const open = t.getAttribute('aria-expanded') !== 'true'; t.setAttribute('aria-expanded', open); ul.hidden = !open; });
  const all = open => v.querySelectorAll('.mtog').forEach(t => { t.setAttribute('aria-expanded', open || t.closest('li').classList.contains('d0')); t.closest('li').querySelector(':scope > ul').hidden = !(open || t.closest('li').classList.contains('d0')); });
  $('#mOpen', v).addEventListener('click', () => all(true)); $('#mClose', v).addEventListener('click', () => all(false));
}

/* ================= flashcards ================= */
const CF = { ch: 'all', x: false, onlyNew: false, i: 0, order: null, flipped: false };
function renderCards() {
  S.known = S.known || {};
  const v = el('div', { class: 'view' });
  const chips = [['all', 'כל הפרקים']].concat(CHAPTERS.filter(c => DECK.some(d => d.c === c.id)).map(c => [c.id, c.title]));
  v.innerHTML = `<p class="eyebrow">חזרה</p><h1>כרטיסיות לחזרה</h1><p class="lead">קראו את השאלה, ענו לעצמכם בראש, ואז הפכו את הכרטיס. סמנו אם ידעתם. מקלדת: רווח להפיכה, חיצים למעבר.</p>
  <div class="chips" id="fch">${chips.map(([id, t]) => `<button class="chip" type="button" data-ch="${id}" aria-pressed="${CF.ch === id}">${t}</button>`).join('')}</div>
  <div class="controls"><label for="fx"><input type="checkbox" id="fx" ${CF.x ? 'checked' : ''}> כולל כרטיסי העשרה (מעבר לתוכנית הבגרות)</label><label for="fn"><input type="checkbox" id="fn" ${CF.onlyNew ? 'checked' : ''}> רק מה שעוד לא ידעתי</label><button class="btn ghost" id="fsh">ערבוב</button></div>
  <div id="fbox"></div>`;
  view.appendChild(v);
  const list = () => { let L = DECK.map((d, i) => ({ ...d, id: i })).filter(d => (CF.ch === 'all' || d.c === CF.ch) && (CF.x || !d.x)); if (CF.onlyNew) L = L.filter(d => !S.known[d.id]); if (CF.order) L.sort((a, b) => (CF.order[a.id] || 0) - (CF.order[b.id] || 0)); return L; };
  const draw = () => {
    const L = list(), box = $('#fbox', v);
    const all = DECK.map((d, i) => ({ ...d, id: i })).filter(d => (CF.ch === 'all' || d.c === CF.ch) && (CF.x || !d.x));
    const kn = all.filter(d => S.known[d.id]).length;
    if (!L.length) { box.innerHTML = `<div class="panel">${teacher(all.length ? `${hi()}סימנתם שאתם יודעים את כל ${all.length} הכרטיסים כאן. כל הכבוד! אפשר לבטל את הסימון "רק מה שעוד לא ידעתי" כדי לחזור על הכול.` : 'אין כרטיסים בבחירה הזו.')}</div>`; return; }
    if (CF.i >= L.length) CF.i = 0;
    const d = L[CF.i], ch = CHAPTERS.find(c => c.id === d.c);
    box.innerHTML = `<div class="fprog"><span>כרטיס <b>${CF.i + 1}</b> מתוך <b>${L.length}</b></span><span>ידעתי: <b>${kn}</b> מתוך <b>${all.length}</b></span></div>
    <div class="fbar" aria-hidden="true"><i style="width:${all.length ? kn / all.length * 100 : 0}%"></i></div>
    <button class="fcard${CF.flipped ? ' flip' : ''}" id="fcard" aria-label="הפיכת הכרטיס"><span class="fin"><span class="fface ffront"><small>${ch ? ch.title : ''}${d.x ? ' · העשרה' : ''}</small><span class="ftxt">${d.q}</span><em>לחצו להפיכה</em></span><span class="fface fback"><small>תשובה</small><span class="ftxt">${d.a}</span></span></span></button>
    <div class="controls fnav"><button class="btn ghost" id="fprev">הקודם</button><button class="btn" id="fflip">הפיכה</button><button class="btn ghost" id="fnext">הבא</button></div>
    <div class="controls fknow" ${CF.flipped ? '' : 'hidden'}><span>ידעתם?</span><button class="btn heat" id="fno">עוד לא</button><button class="btn" id="fyes" style="background:var(--good);border-color:var(--good)">ידעתי</button></div>`;
    const flip = () => { CF.flipped = !CF.flipped; $('#fcard', box).classList.toggle('flip', CF.flipped); box.querySelector('.fknow').hidden = !CF.flipped; };
    const step = n => { CF.i = (CF.i + n + L.length) % L.length; CF.flipped = false; draw(); };
    $('#fcard', box).addEventListener('click', flip); $('#fflip', box).addEventListener('click', flip);
    $('#fprev', box).addEventListener('click', () => step(-1)); $('#fnext', box).addEventListener('click', () => step(1));
    $('#fyes', box).addEventListener('click', () => { S.known[d.id] = 1; save(); CF.flipped = false; if (CF.onlyNew) draw(); else step(1); });
    $('#fno', box).addEventListener('click', () => { delete S.known[d.id]; save(); step(1); });
    v._step = step; v._flip = flip;
  };
  $('#fch', v).addEventListener('click', e => { const b = e.target.closest('[data-ch]'); if (!b) return; CF.ch = b.dataset.ch; CF.i = 0; CF.flipped = false; v.querySelectorAll('#fch .chip').forEach(c => c.setAttribute('aria-pressed', c === b)); draw(); });
  $('#fx', v).addEventListener('change', e => { CF.x = e.target.checked; CF.i = 0; CF.flipped = false; draw(); });
  $('#fn', v).addEventListener('change', e => { CF.onlyNew = e.target.checked; CF.i = 0; CF.flipped = false; draw(); });
  $('#fsh', v).addEventListener('click', () => { CF.order = {}; DECK.forEach((_, i) => CF.order[i] = Math.random()); CF.i = 0; CF.flipped = false; draw(); });
  draw();
}
document.addEventListener('keydown', e => {
  const v = view.querySelector('.view'); if (!v || !v._step || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === 'ArrowLeft') { v._step(1); e.preventDefault(); } else if (e.key === 'ArrowRight') { v._step(-1); e.preventDefault(); } else if (e.key === ' ' && e.target.tagName !== 'BUTTON') { v._flip(); e.preventDefault(); }
});
notifyEntry();
</script></body></html>
